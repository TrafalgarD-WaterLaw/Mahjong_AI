[project]
name = "mahjong-ai"
version = "0.1.0"
description = "麻将AI助手 — 基于CV识别与策略算法的麻将辅助决策系统"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "mss>=10.0",
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "opencv-python==4.10.0.84",  # 中文 Windows 实测版本(imdecode 变通已验证)
    "PySide6>=6.6",
    "torch>=2.2",
    "torchvision>=0.17",
    "ultralytics>=8.2",
]

# PyTorch CUDA 索引: 默认 PyPI 的 torch 在 Windows 上是 CPU 版,
# GTX 1650 Ti(sm_75)需要 cu126 的 CUDA 轮子
[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.uv]
# 本项目以 src/ 目录 + pytest pythonpath 方式组织, 非 pip 安装包, 不构建
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
known-first-party = ["mahjong_core", "mahjong_engine", "mahjong_ai", "mahjong_cv", "mahjong_ui"]

[tool.mypy]
strict = true
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "mahjong_core.*"
strict = true

[[tool.mypy.overrides]]
module = "mahjong_engine.*"
strict = true

[[tool.mypy.overrides]]
module = "mahjong_ai.*"
strict = true

[[tool.mypy.overrides]]
module = "mahjong_cv.*"
strict = true

[[tool.mypy.overrides]]
module = ["cv2.*", "mss.*", "ultralytics.*", "PySide6.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "src/mahjong_ui/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
